[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "home-seek"
version = "0.1.0"
description = "DeepSeek-V4-Flash inference on single RTX 4090 with FP8/FP4 quantization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "accelerate",
    "safetensors",
    "modelscope",
    "huggingface_hub",
    "numpy",
    "einops",
    "matplotlib",
    "torch==2.8.0",
    "httpx>=0.28.1",
    "socksio>=1.0.0",
]

[project.scripts]
home-seek-infer = "home_seek.inference_engine:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["home_seek*"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
disallow_any_unimported = false
exclude = [
    "tests/",
    "scripts/",
    "build/",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",   # sys.path hack for encoding_dsv4 forced
    "E741",   # ambiguous 'I' variable (common in ML for intermediate size)
    "E702",   # semicolons for compact tensor unpacking
]
select = ["F", "E", "W"]

[tool.pytest.ini_options]
markers = [
    "fast: <1s unit tests",
    "slow: >1s tests",
    "integration: end-to-end tests",
    "cuda: requires CUDA GPU (auto-skipped if not available)",
]
testpaths = ["tests"]
addopts = "-m 'not slow'"
