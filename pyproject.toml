[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "home-seek"
version = "0.2.0"
description = "DeepSeek-V4-Flash inference on single RTX 4090"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "QingGo", email = "zyqingjohn@qq.com"},
]
keywords = ["deepseek", "v4", "flash", "inference", "llm", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "transformers>=4.40",
    "safetensors>=0.4",
    "triton>=3.0",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.20"]
huggingface = ["huggingface-hub>=0.26"]

[project.urls]
Homepage = "https://github.com/QingGo/home-seek"
Repository = "https://github.com/QingGo/home-seek"
BugTracker = "https://github.com/QingGo/home-seek/issues"

[project.scripts]
home-seek = "home_seek.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["home_seek*"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.9",
]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "tests/",
    "scripts/",
    "build/",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",
    "E741",
    "E702",
]
select = ["F", "E", "W"]

[tool.ruff.lint.per-file-ignores]
"src/home_seek/encoding_dsv4.py" = ["E501"]
"src/home_seek/profiling_runner.py" = ["E501"]
"scripts/profile_compare.py" = ["E501"]
"scripts/profile_show.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "fast: <1s unit tests",
    "slow: >1s tests",
    "integration: end-to-end tests",
    "cuda: requires CUDA GPU (auto-skipped if not available)",
]
testpaths = ["tests"]
addopts = "-m 'not slow'"
